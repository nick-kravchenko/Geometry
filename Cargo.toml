[package]
name = "geometry"
description = "Grid pathfinding in Rust, compiled to WebAssembly, and bundled with Webpack."
version = "0.1.0"
authors = ["Nick Kravchenko <krava9519@gmail.com>"]
categories = ["wasm"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true

[dependencies]
wasm-bindgen = "0.2.129"
console_error_panic_hook = "0.1.7"
