[package]
name = "rust-webpack-template"
description = "Geometry processing in Rust, compiled to WebAssembly, and bundled with Webpack."
version = "0.1.0"
authors = ["Nick Kravchenko <krava9519@gmail.com>"]
categories = ["wasm"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true

[dependencies]
wasm-bindgen = "0.2.129"
console = "0.16.6"
chrono = "0.4.45"

[dependencies.web-sys]
version = "0.3.106"
features = ["console"]

[target."cfg(debug_assertions)".dependencies]
console_error_panic_hook = "0.1.7"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
futures = "0.3.34"
js-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"
